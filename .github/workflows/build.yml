name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: smart-gateway
            archive: smart-gateway-linux-amd64.tar.gz
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: smart-gateway
            archive: smart-gateway-linux-arm64.tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: smart-gateway.exe
            archive: smart-gateway-windows-amd64.zip
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: smart-gateway
            archive: smart-gateway-darwin-amd64.tar.gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: smart-gateway
            archive: smart-gateway-darwin-arm64.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: web
        run: |
          npm install --registry=https://registry.npmmirror.com
          npm run build

      - name: Fix go.sum
        run: go mod tidy

      - name: Install cross-compiler for linux/arm64
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build backend (linux arm64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -trimpath -ldflags "-s -w -X 'main.Version=$(cat VERSION)'" -o ${{ matrix.output }} .

      - name: Build backend (linux amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X 'main.Version=$(cat VERSION)'" -o ${{ matrix.output }} .

      - name: Build backend (windows)
        if: matrix.goos == 'windows'
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w -X 'main.Version=$(cat VERSION)'" -o ${{ matrix.output }} .

      - name: Build backend (macOS)
        if: matrix.goos == 'darwin'
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w -X 'main.Version=$(cat VERSION)'" -o ${{ matrix.output }} .

      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          mkdir -p release/web/build
          cp ${{ matrix.output }} release/
          cp -r web/build/* release/web/build/
          cp README.md LICENSE .env.example docker-compose.yml release/
          cd release && tar czf ../${{ matrix.archive }} .

      - name: Package (zip - Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          mkdir release/web/build
          cp ${{ matrix.output }} release/
          cp -r web/build/* release/web/build/
          cp README.md,LICENSE,.env.example,docker-compose.yml release/
          Compress-Archive -Path release/* -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Collect archives
        run: |
          mkdir -p ./release-files
          find ./artifacts -name '*.tar.gz' -exec cp {} ./release-files/ \;
          find ./artifacts -name '*.zip' -exec cp {} ./release-files/ \;
          ls -lh ./release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Smart Gateway ${{ github.ref_name }}
          body: |
            ## 🚀 Smart Gateway ${{ github.ref_name }}

            ### 下载
            | 平台 | 文件 |
            |------|------|
            | Linux x86_64 | `smart-gateway-linux-amd64.tar.gz` |
            | Linux ARM64 | `smart-gateway-linux-arm64.tar.gz` |
            | Windows x86_64 | `smart-gateway-windows-amd64.zip` |
            | macOS Intel | `smart-gateway-darwin-amd64.tar.gz` |
            | macOS Apple Silicon | `smart-gateway-darwin-arm64.tar.gz` |

            ### 快速开始
            ```bash
            # Linux / macOS
            tar xzf smart-gateway-linux-amd64.tar.gz
            chmod +x smart-gateway
            export ADMIN_PASSWORD=your_password
            ./smart-gateway

            # Windows — 解压后双击 smart-gateway.exe
            ```

            ### Docker
            ```bash
            docker run -d -p 3000:3000 \
              -e ADMIN_PASSWORD=your_password \
              -v sg-data:/app/data \
              sumo1111/smart-gateway:${{ github.ref_name }}
            ```
          files: ./release-files/*
          draft: false
          prerelease: false
