name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -o smart-gateway .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-gateway-linux
          path: smart-gateway

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build/

  build-windows:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build/

      - name: Build Windows exe
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc             go build -trimpath -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}'"             -o smart-gateway.exe .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-gateway-windows
          path: smart-gateway.exe

  docker:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            sumo1111/smart-gateway:latest
            sumo1111/smart-gateway:${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smart-gateway-windows
          path: ./

      - uses: softprops/action-gh-release@v1
        with:
          files: smart-gateway.exe
          generate_release_notes: true
